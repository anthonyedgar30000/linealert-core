services:
  linealert-historian-db:
    image: timescale/timescaledb:latest-pg16
    container_name: linealert-historian-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: linealert
      POSTGRES_USER: linealert
      POSTGRES_PASSWORD: linealert_dev
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linealert -d linealert"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - linealert_historian_data:/var/lib/postgresql/data

volumes:
  linealert_historian_data:
