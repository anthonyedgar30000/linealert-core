<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Labeling Troubleshooting Guide — LineAlert</title>
<style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f5f7fa;color:#14213d}.loading{max-width:760px;margin:18vh auto;padding:24px;background:#fff;border:1px solid #d5ddea;border-radius:16px}.loading b{display:block;font-size:1.1rem;margin-bottom:6px}.loading small{color:#61708a}</style>
</head>
<body>
<div class="loading" id="loader"><b>Loading the shared LineAlert troubleshooting view…</b><small>Reference content follows the same controlled synthetic plant session as the Plant Canvas.</small></div>
<script>
(async function(){
  try{
    const response=await fetch('./troubleshooting-guide-reference-v102.html',{cache:'no-store'});
    if(!response.ok)throw new Error('baseline '+response.status);
    let html=await response.text();
    const injection='<script src="./demo-session.js"><'+'/script><script src="./guide-session-adapter.js"><'+'/script><script src="./plant-event-model.js"><'+'/script><script src="./guide-event-context-adapter.js"><'+'/script><script src="./event-log-nav.js"><'+'/script>';
    html=html.replace('</body>',injection+'</body>');
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    const loader=document.getElementById('loader');
    if(loader)loader.innerHTML='<b>Troubleshooting guide could not load.</b><small>The preserved synthetic reference or shared-session adapter was unavailable. Reload the page; no equipment action has been taken.</small>';
    console.error(err);
  }
})();
</script>
</body>
</html>
