<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LineAlert · Live Plant Canvas</title>
<style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#eef1ed;color:#17211c}.loading{max-width:760px;margin:18vh auto;padding:24px;background:#fff;border:1px solid #d5dbd7;border-radius:18px}.loading b{display:block;font-size:1.1rem;margin-bottom:6px}.loading small{color:#647068}</style>
</head>
<body>
<div class="loading" id="loader"><b>Loading the shared LineAlert plant session…</b><small>Controlled synthetic demo · one plant state, multiple views.</small></div>
<script>
(async function(){
  try{
    const response=await fetch('./plant-canvas-v102.html',{cache:'no-store'});
    if(!response.ok)throw new Error('baseline '+response.status);
    let html=await response.text();
    const injection='<script src="../demo-session.js"><'+'/script><script src="./trial-discipline-adapter.js"><'+'/script><script src="./maintenance-response-adapter.js"><'+'/script><script src="./maintenance-observe-adapter.js"><'+'/script><script src="./session-adapter.js"><'+'/script><script src="./maintenance-session-adapter.js"><'+'/script><script src="./recovery-fast-forward-adapter.js"><'+'/script><script src="./maintenance-fast-forward-adapter.js"><'+'/script><script src="../physics-informed-roll-model.js"><'+'/script><script src="../plant-event-model.js"><'+'/script><script src="./event-context-adapter.js"><'+'/script><script src="./physics-signature-adapter.js"><'+'/script><script src="../event-journal.js"><'+'/script><script src="./opcua-source-adapter.js"><'+'/script><script src="./opcua-render-ownership-adapter.js"><'+'/script><script src="./opcua-plant-orchestration-adapter.js"><'+'/script><script src="./guide-control-adapter.js"><'+'/script><script src="./investigation-link-adapter.js"><'+'/script><script src="../event-log-nav.js"><'+'/script>';
    html=html.replace('</body>',injection+'</body>');
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    const loader=document.getElementById('loader');
    if(loader)loader.innerHTML='<b>Plant Canvas could not load.</b><small>The preserved synthetic baseline or shared-session adapter was unavailable. Reload the page; no equipment action has been taken.</small>';
    console.error(err);
  }
})();
</script>
</body>
</html>
